name: AI Council direct free model safety checks
on:
  push:
    paths:
      - 'tools/ai-council-chat/external-providers.js'
      - 'tools/ai-council-chat/tests/direct-providers.test.mjs'
      - '.github/workflows/ai-council-provider-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provider module
        run: node --check tools/ai-council-chat/external-providers.js
      - name: Verify no paid model use without explicit connection and user-managed free tier
        run: node --test tools/ai-council-chat/tests/direct-providers.test.mjs
