name: AI Council specification tests
on:
  pull_request:
  push:
    paths:
      - 'tools/ai-council-chat/spec.js'
      - 'tools/ai-council-chat/opencode-manual.js'
      - 'tools/ai-council-chat/tests/opencode-manual.test.mjs'
      - 'tools/ai-council-chat/app.js'
      - 'tools/ai-council-chat/index.html'
      - 'tools/ai-council-chat/telegram-share.js'
      - 'tools/ai-council-chat/review-health.js'
      - 'tools/ai-council-chat/tests/spec.test.mjs'
      - '.github/workflows/ai-council-spec-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check spec module syntax
        run: |
          node --check tools/ai-council-chat/spec.js
          node --check tools/ai-council-chat/opencode-manual.js
          node --check tools/ai-council-chat/app.js
          node --check tools/ai-council-chat/telegram-share.js
      - name: Run specification regression tests
        run: node --test tools/ai-council-chat/tests/spec.test.mjs tools/ai-council-chat/tests/opencode-manual.test.mjs tools/ai-council-chat/tests/telegram-share.test.mjs
