name: AI Council specification tests
on:
  push:
    paths:
      - 'tools/ai-council-chat/**'
      - '.github/workflows/ai-council-spec-tests.yml'
  pull_request:
    paths:
      - 'tools/ai-council-chat/**'
      - '.github/workflows/ai-council-spec-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: tools/ai-council-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for f in *.js *.mjs api/*.js tests/*.mjs; do node --check "$f"; done
      - name: Run offline regression tests
        run: node --test tests/*.test.mjs
      - name: Install temporary Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser smoke with mocked models and public evidence
        run: node tests/browser-smoke.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-mocked-browser-evidence
          path: tools/ai-council-chat/test-results/
          retention-days: 14
