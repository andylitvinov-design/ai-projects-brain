name: Holistic House Gemini audit → Telegram

on:
  schedule:
    # After the existing 09:00 America/Toronto ChatGPT audit. Timezone includes DST.
    - cron: '15 9 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily-gemini-telegram.yml'
      - 'tools/ai-council-chat/scripts/daily-gemini-telegram.mjs'
      - 'tools/ai-council-chat/tests/daily-gemini-telegram.test.mjs'

concurrency:
  group: holistic-house-daily-gemini-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script and run offline security tests
        run: |
          node --check tools/ai-council-chat/scripts/daily-gemini-telegram.mjs
          node --test tools/ai-council-chat/tests/daily-gemini-telegram.test.mjs

  audit-and-send:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require separately configured credentials
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo '::error::Configure GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID in GitHub Actions secrets. No audit was sent.'
            exit 1
          fi
      - name: Public HTTP evidence + one Gemini analysis per Toronto day
        run: node tools/ai-council-chat/scripts/daily-gemini-telegram.mjs prepare
      - name: Save versioned public report in GitHub (not Vercel)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'holistic-house-audit[bot]'
          git config user.email 'holistic-house-audit@users.noreply.github.com'
          git add tools/ai-council-chat/reports/GEMINI-LATEST.md
          git add tools/ai-council-chat/reports/*-gemini-audit.md
          git add tools/ai-council-chat/reports/evidence/*-gemini.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: daily Gemini public audit $(TZ=America/Toronto date +%F) [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Deliver original Gemini report as a Telegram document
        run: node tools/ai-council-chat/scripts/daily-gemini-telegram.mjs deliver
      - name: Record successful Telegram delivery without secrets
        shell: bash
        run: |
          set -euo pipefail
          git add tools/ai-council-chat/reports/delivery/*-telegram.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: record Telegram Gemini audit delivery [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
