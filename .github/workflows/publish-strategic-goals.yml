name: Publish Strategic Goal Scorecard

on:
  pull_request:
    paths:
      - 'projects/codex-automation/strategic-goal-scorecard.json'
      - 'projects/codex-automation/strategic-evidence.json'
      - 'projects/codex-automation/strategic-source-observations.json'
      - 'projects/codex-automation/strategic-collector-registry.json'
      - 'projects/codex-automation/strategic-action-plan.json'
      - 'scripts/build-strategic-source-evidence.mjs'
      - 'scripts/build-strategic-action-plan.mjs'
      - 'scripts/apply-strategic-evidence.mjs'
      - 'scripts/apply-strategic-goal-scorecard.mjs'
      - 'scripts/update-daily-intelligence.mjs'
      - 'tests/strategic-source-evidence.test.mjs'
      - 'tests/strategic-evidence-ingestion.test.mjs'
      - 'tests/strategic-action-plan.test.mjs'
      - 'tests/strategic-goal-scorecard.test.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - '.github/workflows/publish-strategic-goals.yml'
  push:
    branches: [main]
    paths:
      - 'projects/codex-automation/strategic-goal-scorecard.json'
      - 'projects/codex-automation/strategic-evidence.json'
      - 'projects/codex-automation/strategic-source-observations.json'
      - 'projects/codex-automation/strategic-collector-registry.json'
      - 'projects/codex-automation/strategic-action-plan.json'
      - 'scripts/build-strategic-source-evidence.mjs'
      - 'scripts/build-strategic-action-plan.mjs'
      - 'scripts/apply-strategic-evidence.mjs'
      - 'scripts/apply-strategic-goal-scorecard.mjs'
      - 'scripts/update-daily-intelligence.mjs'
      - 'tests/strategic-source-evidence.test.mjs'
      - 'tests/strategic-evidence-ingestion.test.mjs'
      - 'tests/strategic-action-plan.test.mjs'
      - 'tests/strategic-goal-scorecard.test.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - '.github/workflows/publish-strategic-goals.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: strategic-goal-scorecard-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate strategic scoring, sources and action selection
        run: |
          set -euo pipefail
          node --test tests/daily-intelligence-writer.test.mjs
          node --test tests/strategic-goal-scorecard.test.mjs
          node --test tests/strategic-source-evidence.test.mjs
          node --test tests/strategic-evidence-ingestion.test.mjs
          node --test tests/strategic-action-plan.test.mjs

      - name: Build proof-gated strategic evidence
        run: |
          set -euo pipefail
          node scripts/build-strategic-source-evidence.mjs

      - name: Apply verified strategic evidence
        run: |
          set -euo pipefail
          node scripts/apply-strategic-evidence.mjs

      - name: Build strategic collector action plan
        run: |
          set -euo pipefail
          node scripts/build-strategic-action-plan.mjs

      - name: Apply canonical strategic scorecard
        run: |
          set -euo pipefail
          node scripts/apply-strategic-goal-scorecard.mjs
          node scripts/validate-portfolio-dashboard.mjs \
            projects/codex-automation/system-health-dashboard.json \
            projects/portfolio-registry.json \
            projects/codex-automation/system-health-dashboard.md

      - name: Commit strategic dashboard snapshot
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/codex-automation/strategic-evidence.json \
            projects/codex-automation/strategic-goal-scorecard.json \
            projects/codex-automation/strategic-action-plan.json \
            projects/codex-automation/system-health-dashboard.json \
            projects/codex-automation/system-health-dashboard.md
          if git diff --cached --quiet; then
            echo 'Strategic source evidence, action plan and scorecard are already applied.'
          else
            git commit -m 'Publish proof-gated strategic source evidence and action plan'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch exact snapshot publisher
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-system-health-dashboard.yml --ref main
