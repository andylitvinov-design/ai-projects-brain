name: Publish System Health Dashboard

on:
  pull_request:
    paths:
      - 'projects/codex-automation/system-health-dashboard.json'
      - 'projects/codex-automation/system-health-dashboard.md'
      - 'projects/codex-automation/system-health-dashboard-publication-trace.json'
      - 'projects/codex-automation/pending-dashboard-upgrade.json'
      - 'projects/codex-automation/daily-improve-memory.md'
      - 'projects/portfolio-registry.json'
      - 'scripts/update-daily-intelligence.mjs'
      - 'scripts/publish-morning-dashboard-snapshot.mjs'
      - 'scripts/apply-dashboard-upgrade-record.mjs'
      - 'scripts/apply-cycle-dashboard-upgrade-record.mjs'
      - 'scripts/sync-dashboard-markdown-core.mjs'
      - 'scripts/normalize-dashboard-not-applicable.mjs'
      - 'scripts/validate-portfolio-dashboard.mjs'
      - 'scripts/validate-dashboard-publication-contract.mjs'
      - 'scripts/run-agent-harness-validation-evidence.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - 'tests/morning-dashboard-publication.test.mjs'
      - 'tests/dashboard-upgrade-record.test.mjs'
      - 'tests/dashboard-cycle-upgrade-record.test.mjs'
      - 'tests/dashboard-markdown-core-sync.test.mjs'
      - 'tests/dashboard-publisher-exact-snapshot.test.mjs'
      - 'tests/not-applicable-metric-semantics.test.mjs'
      - 'tests/portfolio-dashboard-validator.test.mjs'
      - 'tests/dashboard-publication-contract.test.mjs'
      - 'systems/evening-upgrade-runtime-contract.md'
      - '.github/workflows/publish-system-health-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'projects/codex-automation/system-health-dashboard.json'
      - 'projects/codex-automation/system-health-dashboard.md'
      - 'projects/codex-automation/system-health-dashboard-publication-trace.json'
      - 'projects/codex-automation/pending-dashboard-upgrade.json'
      - 'projects/codex-automation/daily-improve-memory.md'
      - 'projects/portfolio-registry.json'
      - 'scripts/update-daily-intelligence.mjs'
      - 'scripts/publish-morning-dashboard-snapshot.mjs'
      - 'scripts/apply-dashboard-upgrade-record.mjs'
      - 'scripts/apply-cycle-dashboard-upgrade-record.mjs'
      - 'scripts/sync-dashboard-markdown-core.mjs'
      - 'scripts/normalize-dashboard-not-applicable.mjs'
      - 'scripts/validate-portfolio-dashboard.mjs'
      - 'scripts/validate-dashboard-publication-contract.mjs'
      - 'scripts/run-agent-harness-validation-evidence.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - 'tests/morning-dashboard-publication.test.mjs'
      - 'tests/dashboard-upgrade-record.test.mjs'
      - 'tests/dashboard-cycle-upgrade-record.test.mjs'
      - 'tests/dashboard-markdown-core-sync.test.mjs'
      - 'tests/dashboard-publisher-exact-snapshot.test.mjs'
      - 'tests/not-applicable-metric-semantics.test.mjs'
      - 'tests/portfolio-dashboard-validator.test.mjs'
      - 'tests/dashboard-publication-contract.test.mjs'
      - 'systems/evening-upgrade-runtime-contract.md'
      - '.github/workflows/publish-system-health-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-health-dashboard-publication
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply explicit pending dashboard upgrade
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail
          RECORD='projects/codex-automation/pending-dashboard-upgrade.json'
          if test -f "$RECORD"; then
            node scripts/apply-cycle-dashboard-upgrade-record.mjs --record "$RECORD" --consume
            node scripts/normalize-dashboard-not-applicable.mjs \
              --file projects/codex-automation/system-health-dashboard.json
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
          node scripts/sync-dashboard-markdown-core.mjs

      - name: Validate exact adaptive snapshot and publication contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-portfolio-dashboard.mjs \
            projects/codex-automation/system-health-dashboard.json \
            projects/portfolio-registry.json \
            projects/codex-automation/system-health-dashboard.md
          node --test tests/portfolio-dashboard-validator.test.mjs
          node --test tests/daily-intelligence-writer.test.mjs
          node --test tests/morning-dashboard-publication.test.mjs
          node --test tests/dashboard-publication-contract.test.mjs
          node --test tests/dashboard-upgrade-record.test.mjs
          node --test tests/dashboard-cycle-upgrade-record.test.mjs
          node --test tests/dashboard-markdown-core-sync.test.mjs
          node --test tests/dashboard-publisher-exact-snapshot.test.mjs
          node --test tests/not-applicable-metric-semantics.test.mjs
          node scripts/apply-cycle-dashboard-upgrade-record.mjs --trace-only \
            --trace /tmp/system-health-dashboard-publication-trace.json \
            --canonical-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --canonical-blob bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --mirror-commit cccccccccccccccccccccccccccccccccccccccc \
            --mirror-blob bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          node scripts/validate-dashboard-publication-contract.mjs \
            --trace /tmp/system-health-dashboard-publication-trace.json

      - name: Preserve validated exact snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-system-health-dashboard-snapshot
          path: |
            projects/codex-automation/system-health-dashboard.json
            projects/codex-automation/system-health-dashboard.md
            projects/portfolio-registry.json
          if-no-files-found: error

      - name: Sync exact JSON to Brain Management
        if: github.event_name != 'pull_request'
        id: mirror
        env:
          TOKEN: ${{ secrets.BRAIN_MANAGEMENT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo 'BRAIN_MANAGEMENT_SYNC_TOKEN is required for mirror publication.'; exit 1; }
          API='https://api.github.com/repos/andylitvinov-design/brain-management/contents/system-health-dashboard/data/current-system-health-dashboard.json'
          REFS='https://api.github.com/repos/andylitvinov-design/brain-management/git/ref/heads/main'
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body -sS "${AUTH[@]}" "$API?ref=main" > /tmp/current-mirror.json
          CURRENT_BLOB="$(jq -r '.sha' /tmp/current-mirror.json)"
          LOCAL_BLOB="$(git hash-object projects/codex-automation/system-health-dashboard.json)"

          if test "$LOCAL_BLOB" = "$CURRENT_BLOB"; then
            MIRROR_COMMIT="$(curl --fail-with-body -sS "${AUTH[@]}" "$REFS" | jq -r '.object.sha')"
            MIRROR_BLOB="$CURRENT_BLOB"
            echo 'Mirror already equals the exact canonical candidate; no duplicate content commit created.'
          else
            CONTENT="$(base64 -w0 projects/codex-automation/system-health-dashboard.json)"
            jq -n \
              --arg message 'Sync exact system-health dashboard snapshot' \
              --arg content "$CONTENT" \
              --arg sha "$CURRENT_BLOB" \
              --arg branch main \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/mirror-payload.json
            curl --fail-with-body -sS -X PUT "${AUTH[@]}" "$API" --data-binary @/tmp/mirror-payload.json > /tmp/mirror-response.json
            MIRROR_COMMIT="$(jq -r '.commit.sha' /tmp/mirror-response.json)"
            MIRROR_BLOB="$(jq -r '.content.sha' /tmp/mirror-response.json)"
          fi

          test "$LOCAL_BLOB" = "$MIRROR_BLOB" || { echo 'canonical candidate and mirror blob differ'; exit 1; }
          echo "commit=$MIRROR_COMMIT" >> "$GITHUB_OUTPUT"
          echo "blob=$MIRROR_BLOB" >> "$GITHUB_OUTPUT"

      - name: Commit controlled canonical snapshot changes
        if: github.event_name != 'pull_request'
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/codex-automation/system-health-dashboard.json \
            projects/codex-automation/system-health-dashboard.md \
            projects/portfolio-registry.json
          git add -u projects/codex-automation/pending-dashboard-upgrade.json
          if git diff --cached --quiet; then
            CANONICAL_COMMIT="$GITHUB_SHA"
          else
            git commit -m 'Apply controlled system-health dashboard snapshot [skip ci]'
            git push origin HEAD:main
            CANONICAL_COMMIT="$(git rev-parse HEAD)"
          fi
          echo "commit=$CANONICAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "blob=$(git rev-parse "$CANONICAL_COMMIT":projects/codex-automation/system-health-dashboard.json)" >> "$GITHUB_OUTPUT"

      - name: Generate and validate exact publication trace
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-cycle-dashboard-upgrade-record.mjs --trace-only \
            --dashboard projects/codex-automation/system-health-dashboard.json \
            --trace projects/codex-automation/system-health-dashboard-publication-trace.json \
            --canonical-commit '${{ steps.canonical.outputs.commit }}' \
            --canonical-blob '${{ steps.canonical.outputs.blob }}' \
            --mirror-commit '${{ steps.mirror.outputs.commit }}' \
            --mirror-blob '${{ steps.mirror.outputs.blob }}'
          node scripts/validate-dashboard-publication-contract.mjs
          git add projects/codex-automation/system-health-dashboard-publication-trace.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact dashboard publication trace [skip ci]'
            git push origin HEAD:main
          fi

      - name: Dispatch Brain Management publication
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.BRAIN_MANAGEMENT_SYNC_TOKEN }}
          SOURCE_SHA: ${{ steps.canonical.outputs.commit }}
        run: |
          set -euo pipefail
          curl --fail-with-body --request POST \
            'https://api.github.com/repos/andylitvinov-design/brain-management/dispatches' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"event_type\":\"system-health-dashboard-updated\",\"client_payload\":{\"canonical_sha\":\"$SOURCE_SHA\",\"schema_version\":6,\"metric_model\":\"adaptive_portfolio_project_goal_v1\"}}"
