name: Publish System Health Dashboard

on:
  pull_request:
    paths:
      - 'projects/codex-automation/system-health-dashboard.json'
      - 'projects/codex-automation/system-health-dashboard.md'
      - 'projects/codex-automation/system-health-dashboard-publication-trace.json'
      - 'projects/codex-automation/daily-improve-memory.md'
      - 'projects/portfolio-registry.json'
      - 'scripts/update-daily-intelligence.mjs'
      - 'scripts/publish-morning-dashboard-snapshot.mjs'
      - 'scripts/validate-portfolio-dashboard.mjs'
      - 'scripts/validate-dashboard-publication-contract.mjs'
      - 'scripts/run-agent-harness-validation-evidence.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - 'tests/morning-dashboard-publication.test.mjs'
      - 'tests/portfolio-dashboard-validator.test.mjs'
      - 'tests/dashboard-publication-contract.test.mjs'
      - '.github/workflows/publish-system-health-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'projects/codex-automation/system-health-dashboard.json'
      - 'projects/codex-automation/system-health-dashboard.md'
      - 'projects/codex-automation/system-health-dashboard-publication-trace.json'
      - 'projects/codex-automation/daily-improve-memory.md'
      - 'projects/portfolio-registry.json'
      - 'scripts/update-daily-intelligence.mjs'
      - 'scripts/publish-morning-dashboard-snapshot.mjs'
      - 'scripts/validate-portfolio-dashboard.mjs'
      - 'scripts/validate-dashboard-publication-contract.mjs'
      - 'scripts/run-agent-harness-validation-evidence.mjs'
      - 'tests/daily-intelligence-writer.test.mjs'
      - 'tests/morning-dashboard-publication.test.mjs'
      - 'tests/portfolio-dashboard-validator.test.mjs'
      - 'tests/dashboard-publication-contract.test.mjs'
      - '.github/workflows/publish-system-health-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-health-dashboard-publication
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Morning canonical candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(TZ=Europe/Podgorica date --iso-8601=seconds)"
          echo "timestamp=$STAMP" >> "$GITHUB_OUTPUT"
          node scripts/publish-morning-dashboard-snapshot.mjs \
            --timestamp "$STAMP" \
            --dashboard projects/codex-automation/system-health-dashboard.json \
            --markdown projects/codex-automation/system-health-dashboard.md \
            --memory projects/codex-automation/daily-improve-memory.md \
            --registry projects/portfolio-registry.json
      - name: Validate adaptive snapshot and publication pipeline
        run: |
          set -euo pipefail
          node scripts/validate-portfolio-dashboard.mjs \
            projects/codex-automation/system-health-dashboard.json \
            projects/portfolio-registry.json \
            projects/codex-automation/system-health-dashboard.md
          node --test tests/portfolio-dashboard-validator.test.mjs
          node --test tests/daily-intelligence-writer.test.mjs
          node --test tests/morning-dashboard-publication.test.mjs
          node --test tests/dashboard-publication-contract.test.mjs
      - name: Preserve generated candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: morning-dashboard-candidate
          path: |
            projects/codex-automation/system-health-dashboard.json
            projects/codex-automation/system-health-dashboard.md
          if-no-files-found: error
      - name: Sync exact JSON to Brain Management
        if: github.event_name != 'pull_request'
        id: mirror
        env:
          TOKEN: ${{ secrets.BRAIN_MANAGEMENT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "BRAIN_MANAGEMENT_SYNC_TOKEN is required for mirror publication."; exit 1; }
          API="https://api.github.com/repos/andylitvinov-design/brain-management/contents/system-health-dashboard/data/current-system-health-dashboard.json"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          CURRENT_SHA="$(curl --fail-with-body -sS "${AUTH[@]}" "$API?ref=main" | jq -r '.sha')"
          CONTENT="$(base64 -w0 projects/codex-automation/system-health-dashboard.json)"
          jq -n --arg message "Sync Morning system-health dashboard snapshot" --arg content "$CONTENT" --arg sha "$CURRENT_SHA" --arg branch main \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/mirror-payload.json
          curl --fail-with-body -sS -X PUT "${AUTH[@]}" "$API" --data-binary @/tmp/mirror-payload.json > /tmp/mirror-response.json
          MIRROR_COMMIT="$(jq -r '.commit.sha' /tmp/mirror-response.json)"
          MIRROR_BLOB="$(jq -r '.content.sha' /tmp/mirror-response.json)"
          LOCAL_BLOB="$(git hash-object projects/codex-automation/system-health-dashboard.json)"
          test "$LOCAL_BLOB" = "$MIRROR_BLOB" || { echo "canonical candidate and mirror blob differ"; exit 1; }
          echo "commit=$MIRROR_COMMIT" >> "$GITHUB_OUTPUT"
          echo "blob=$MIRROR_BLOB" >> "$GITHUB_OUTPUT"
      - name: Commit canonical Markdown and JSON
        if: github.event_name != 'pull_request'
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/codex-automation/system-health-dashboard.json projects/codex-automation/system-health-dashboard.md
          git commit -m "Publish Morning system-health dashboard snapshot [skip ci]"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "blob=$(git rev-parse HEAD:projects/codex-automation/system-health-dashboard.json)" >> "$GITHUB_OUTPUT"
      - name: Generate and validate publication trace
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-morning-dashboard-snapshot.mjs --trace-only \
            --dashboard projects/codex-automation/system-health-dashboard.json \
            --trace projects/codex-automation/system-health-dashboard-publication-trace.json \
            --canonical-commit '${{ steps.canonical.outputs.commit }}' \
            --canonical-blob '${{ steps.canonical.outputs.blob }}' \
            --mirror-commit '${{ steps.mirror.outputs.commit }}' \
            --mirror-blob '${{ steps.mirror.outputs.blob }}'
          node scripts/validate-dashboard-publication-contract.mjs
          git add projects/codex-automation/system-health-dashboard-publication-trace.json
          git commit -m "Record Morning dashboard publication trace [skip ci]"
          git push origin HEAD:main
      - name: Dispatch Brain Management publication
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.BRAIN_MANAGEMENT_SYNC_TOKEN }}
          SHA: ${{ steps.canonical.outputs.commit }}
        run: |
          set -euo pipefail
          curl --fail-with-body --request POST \
            "https://api.github.com/repos/andylitvinov-design/brain-management/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"system-health-dashboard-updated\",\"client_payload\":{\"canonical_sha\":\"$SHA\",\"schema_version\":6,\"metric_model\":\"adaptive_portfolio_project_goal_v1\"}}"
