name: HBA local zero-budget checks

on:
  pull_request:
    paths:
      - "tools/holistic-browser-agent/**"
      - ".github/workflows/hba-zero-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hba-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-chromium:
    runs-on: ubuntu-24.04 # Pin supported Playwright 1.57 platform; standard free public-repo runner.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned free dependencies and Chromium
        working-directory: tools/holistic-browser-agent
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2
          python -m playwright install --with-deps chromium
      - name: Verify Python and isolated Chromium security tests
        working-directory: tools/holistic-browser-agent
        env:
          HBA_RUNS_DIR: ${{ runner.temp }}/hba-ci-runs
        run: |
          bash -n INSTALL_MAC.command
          python -m compileall -q hba
          python -m pytest -q tests
          python -m hba doctor
          python -m hba plan examples/offline-fixture.json
          python -m hba run examples/offline-fixture.json
