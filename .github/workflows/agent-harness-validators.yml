name: Agent Harness Validators

on:
  pull_request:
    paths:
      - 'projects/codex-automation/**'
      - 'systems/**'
      - 'agent-skills/**'
      - 'scripts/**'
      - 'projects.json'
      - 'data/project-index.json'
      - '.github/workflows/agent-harness-validators.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/codex-automation/**'
      - 'systems/**'
      - 'agent-skills/**'
      - 'scripts/**'
      - 'projects.json'
      - 'data/project-index.json'
      - '.github/workflows/agent-harness-validators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare validator evidence directory
        run: mkdir -p agent-harness-validation-evidence

      - name: Validate agentic prompts and feedback-loop artifacts
        if: always()
        run: |
          set -o pipefail
          node scripts/validate-agentic-prompts.mjs 2>&1 | tee agent-harness-validation-evidence/validate-agentic-prompts.log

      - name: Run deterministic behavior replay fixtures
        if: always()
        run: |
          set -o pipefail
          node scripts/run-behavior-replay-fixtures.mjs 2>&1 | tee agent-harness-validation-evidence/run-behavior-replay-fixtures.log

      - name: Verify context-scout wiring
        if: always()
        run: |
          set -o pipefail
          node scripts/verify-context-scout.mjs 2>&1 | tee agent-harness-validation-evidence/verify-context-scout.log

      - name: Validate projects brain and secret scan
        if: always()
        run: |
          set -o pipefail
          node scripts/validate-projects-brain.mjs 2>&1 | tee agent-harness-validation-evidence/validate-projects-brain.log

      - name: Upload validator evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-validation-evidence
          path: agent-harness-validation-evidence/
          if-no-files-found: warn
