name: Agent Harness Validators

on:
  pull_request:
    paths:
      - 'projects/codex-automation/**'
      - 'systems/**'
      - 'agent-skills/**'
      - 'scripts/**'
      - 'projects.json'
      - 'data/project-index.json'
      - '.github/workflows/agent-harness-validators.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/codex-automation/**'
      - 'systems/**'
      - 'agent-skills/**'
      - 'scripts/**'
      - 'projects.json'
      - 'data/project-index.json'
      - '.github/workflows/agent-harness-validators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run harness validators and capture raw evidence
        run: node scripts/run-agent-harness-validation-evidence.mjs

      - name: Upload validator evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-harness-validation-evidence
          path: agent-harness-validation-evidence/
          if-no-files-found: error
