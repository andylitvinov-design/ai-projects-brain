name: AI Council browser screenshots
on:
  workflow_dispatch:
    inputs:
      capture_tantra_evidence:
        description: 'Artifact-only public Free Tantra mobile evidence (no submissions)'
        type: boolean
        default: false
      tantra_source_sha:
        description: 'Optional independently verified live Holistic House source SHA'
        type: string
        required: false
  push:
    paths:
      - '.github/workflows/ai-council-screenshots.yml'
      - 'tools/ai-council-chat/capture-screenshots.mjs'
      - 'tools/ai-council-chat/screenshot-evidence.mjs'
      - 'tools/ai-council-chat/capture-tantra-mobile.mjs'
permissions:
  contents: read
concurrency:
  group: ai-council-screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright
        working-directory: tools/ai-council-chat
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture public desktop and mobile pages
        working-directory: tools/ai-council-chat
        run: node capture-screenshots.mjs
      - name: Save evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-browser-screenshots
          path: tools/ai-council-chat/screenshots/
          retention-days: 14
      - name: Capture optional public Free Tantra mobile evidence
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.capture_tantra_evidence) || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.event.deleted != true && contains(github.event.head_commit.message, '[capture-tantra]')))
        working-directory: tools/ai-council-chat
        env:
          TANTRA_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.tantra_source_sha || '' }}
        run: node capture-tantra-mobile.mjs
      - name: Save separate Free Tantra evidence artifact
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.capture_tantra_evidence) || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.event.deleted != true && contains(github.event.head_commit.message, '[capture-tantra]')))
        uses: actions/upload-artifact@v4
        with:
          name: public-free-tantra-mobile-evidence
          path: tools/ai-council-chat/test-results/tantra-mobile-evidence/
          retention-days: 14
