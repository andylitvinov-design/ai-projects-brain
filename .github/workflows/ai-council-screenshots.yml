name: AI Council browser screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-council-screenshots.yml'
permissions:
  contents: write
concurrency:
  group: ai-council-screenshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright
        working-directory: tools/ai-council-chat
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture public desktop and mobile pages
        working-directory: tools/ai-council-chat
        run: node capture-screenshots.mjs
      - name: Save evidence as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-browser-screenshots
          path: tools/ai-council-chat/screenshots/
          retention-days: 14
      - name: Commit latest public screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ai-council-chat/screenshots/
          if git diff --cached --quiet; then
            echo "No changed screenshots"
          else
            git commit -m "chore(ai-council): refresh public browser screenshots [skip ci]"
            git push origin HEAD:main
          fi
